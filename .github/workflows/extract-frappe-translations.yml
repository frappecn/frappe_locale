name: Extract Frappe and ERPNext translations

on:
  schedule:
    - cron: "30 9 * * 0"
  workflow_dispatch:

concurrency:
  group: extract-frappe-translations-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  extract:
    name: Extract from Frappe and ERPNext (${{ github.ref_name }})
    runs-on: ubuntu-latest
    env:
      LOCALE: zh

    steps:
      - name: Checkout frappe_locale
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout matching Frappe source
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: ${{ github.ref_name }}
          path: .sources/frappe
          fetch-depth: 1

      - name: Checkout matching ERPNext source
        uses: actions/checkout@v4
        with:
          repository: frappe/erpnext
          ref: ${{ github.ref_name }}
          path: .sources/erpnext
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Bench
        run: python -m pip install --upgrade pip frappe-bench

      - name: Create temporary Bench
        run: |
          bench init "$RUNNER_TEMP/frappe-locale-bench" \
            --skip-assets \
            --skip-redis-config-generation \
            --python "$(which python)" \
            --frappe-path "$GITHUB_WORKSPACE/.sources/frappe"

      - name: Install ERPNext into temporary Bench
        run: |
          cd "$RUNNER_TEMP/frappe-locale-bench"
          bench get-app \
            --skip-assets \
            --soft-link \
            "$GITHUB_WORKSPACE/.sources/erpnext"

      - name: Generate and update Frappe and ERPNext translations
        run: |
          cd "$RUNNER_TEMP/frappe-locale-bench"

          for app in frappe erpnext; do
            bench generate-pot-file --app "$app"

            if [ -f "$GITHUB_WORKSPACE/translations/$app/$LOCALE.po" ]; then
              cp "$GITHUB_WORKSPACE/translations/$app/$LOCALE.po" \
                "$RUNNER_TEMP/frappe-locale-bench/apps/$app/$app/locale/$LOCALE.po"
            fi

            bench update-po-files --app "$app" --locale "$LOCALE"
          done

      - name: Copy translation files into frappe_locale
        run: |
          for app in frappe erpnext; do
            mkdir -p "$GITHUB_WORKSPACE/translations/$app"

            cp "$RUNNER_TEMP/frappe-locale-bench/apps/$app/$app/locale/main.pot" \
              "$GITHUB_WORKSPACE/translations/$app/main.pot"
            cp "$RUNNER_TEMP/frappe-locale-bench/apps/$app/$app/locale/$LOCALE.po" \
              "$GITHUB_WORKSPACE/translations/$app/$LOCALE.po"
          done

      - name: Build untranslated PO for frappe_locale
        run: |
          "$RUNNER_TEMP/frappe-locale-bench/env/bin/python" \
            "$GITHUB_WORKSPACE/scripts/extract_untranslated_po.py" \
            "$GITHUB_WORKSPACE/translations/frappe/$LOCALE.po" \
            "$GITHUB_WORKSPACE/frappe_locale/locale/$LOCALE.po"

      - name: Validate generated files
        run: |
          test -s "$GITHUB_WORKSPACE/translations/frappe/main.pot"
          test -s "$GITHUB_WORKSPACE/translations/frappe/$LOCALE.po"
          test -s "$GITHUB_WORKSPACE/translations/erpnext/main.pot"
          test -s "$GITHUB_WORKSPACE/translations/erpnext/$LOCALE.po"
          test -s "$GITHUB_WORKSPACE/frappe_locale/locale/$LOCALE.po"
          git diff --check

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- translations/frappe translations/erpnext frappe_locale/locale)" ]; then
            echo "No Frappe or ERPNext translation changes detected."
            exit 0
          fi

          git config user.name "frappe-locale-bot"
          git config user.email "frappe-locale-bot@users.noreply.github.com"

          git add \
            translations/frappe/main.pot \
            "translations/frappe/$LOCALE.po" \
            translations/erpnext/main.pot \
            "translations/erpnext/$LOCALE.po" \
            "frappe_locale/locale/$LOCALE.po"
          git commit -m "chore: update Frappe and ERPNext translations"
          git push origin "HEAD:$GITHUB_REF_NAME"
