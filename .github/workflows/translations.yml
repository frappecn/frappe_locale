name: 更新语言包

on:
  schedule:
    - cron: "30 9 * * 0"
  workflow_dispatch:

concurrency:
  group: translations-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  extract:
    name: 提取翻译 (${{ github.ref_name }})
    runs-on: ubuntu-latest
    env:
      LOCALE: zh

    steps:
      - name: 检出 Frappe_locale
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检出 Frappe
        uses: actions/checkout@v7
        with:
          repository: frappe/frappe
          ref: ${{ github.ref_name }}
          path: .sources/frappe
          fetch-depth: 1

      - name: 检出 ERPNext
        uses: actions/checkout@v7
        with:
          repository: frappe/erpnext
          ref: ${{ github.ref_name }}
          path: .sources/erpnext
          fetch-depth: 1

      - name: 检出 HRMS
        uses: actions/checkout@v7
        with:
          repository: frappe/hrms
          ref: ${{ github.ref_name }}
          path: .sources/hrms
          fetch-depth: 1

      - name: 检出 CRM
        uses: actions/checkout@v7
        with:
          repository: frappe/crm
          ref: ${{ github.ref_name }}
          path: .sources/crm
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 按照 Bench
        run: python -m pip install --upgrade pip frappe-bench

      - name: 创建临时 Bench 实例
        run: |
          bench init "$RUNNER_TEMP/frappe-locale-bench" \
            --skip-assets \
            --skip-redis-config-generation \
            --python "$(which python)" \
            --frappe-path "$GITHUB_WORKSPACE/.sources/frappe"

      - name: 安装到临时 Bench 实例
        run: |
          cd "$RUNNER_TEMP/frappe-locale-bench"
          for app in erpnext hrms crm; do
            bench get-app \
              --skip-assets \
              "$GITHUB_WORKSPACE/.sources/$app"
          done

      - name: 生成并更新翻译包
        run: |
          cd "$RUNNER_TEMP/frappe-locale-bench"

          for app in frappe erpnext hrms crm; do
            bench generate-pot-file --app "$app"

            mkdir -p "$RUNNER_TEMP/frappe-locale-bench/apps/$app/$app/locale"
            if [ -f "$GITHUB_WORKSPACE/translations/$app/$LOCALE.po" ]; then
              cp "$GITHUB_WORKSPACE/translations/$app/$LOCALE.po" \
                "$RUNNER_TEMP/frappe-locale-bench/apps/$app/$app/locale/$LOCALE.po"
            fi

            bench update-po-files --app "$app" --locale "$LOCALE"
          done

      - name: 将翻译包复制到 Frappe_locale
        run: |
          for app in frappe erpnext hrms crm; do
            mkdir -p "$GITHUB_WORKSPACE/translations/$app"

            cp "$RUNNER_TEMP/frappe-locale-bench/apps/$app/$app/locale/main.pot" \
              "$GITHUB_WORKSPACE/translations/$app/main.pot"
            cp "$RUNNER_TEMP/frappe-locale-bench/apps/$app/$app/locale/$LOCALE.po" \
              "$GITHUB_WORKSPACE/translations/$app/$LOCALE.po"
          done

          for file in \
            "$GITHUB_WORKSPACE/translations/frappe/main.pot" \
            "$GITHUB_WORKSPACE/translations/frappe/$LOCALE.po" \
            "$GITHUB_WORKSPACE/translations/erpnext/main.pot" \
            "$GITHUB_WORKSPACE/translations/erpnext/$LOCALE.po" \
            "$GITHUB_WORKSPACE/translations/hrms/main.pot" \
            "$GITHUB_WORKSPACE/translations/hrms/$LOCALE.po" \
            "$GITHUB_WORKSPACE/translations/crm/main.pot" \
            "$GITHUB_WORKSPACE/translations/crm/$LOCALE.po"; do
            perl -0pi -e 's/\n+\z/\n/' "$file"
          done

      - name: 构建待翻译的 PO 文件
        run: |
          "$RUNNER_TEMP/frappe-locale-bench/env/bin/python" \
            "$GITHUB_WORKSPACE/scripts/extract_untranslated_po.py" \
            "$GITHUB_WORKSPACE/translations/frappe/$LOCALE.po" \
            "$GITHUB_WORKSPACE/translations/erpnext/$LOCALE.po" \
            "$GITHUB_WORKSPACE/translations/hrms/$LOCALE.po" \
            "$GITHUB_WORKSPACE/translations/crm/$LOCALE.po" \
            "$GITHUB_WORKSPACE/frappe_locale/locale/$LOCALE.po"

      - name: 校验生成的文件
        run: |
          test -s "$GITHUB_WORKSPACE/translations/frappe/main.pot"
          test -s "$GITHUB_WORKSPACE/translations/frappe/$LOCALE.po"
          test -s "$GITHUB_WORKSPACE/translations/erpnext/main.pot"
          test -s "$GITHUB_WORKSPACE/translations/erpnext/$LOCALE.po"
          test -s "$GITHUB_WORKSPACE/translations/hrms/main.pot"
          test -s "$GITHUB_WORKSPACE/translations/hrms/$LOCALE.po"
          test -s "$GITHUB_WORKSPACE/translations/crm/main.pot"
          test -s "$GITHUB_WORKSPACE/translations/crm/$LOCALE.po"
          test -s "$GITHUB_WORKSPACE/frappe_locale/locale/$LOCALE.po"
          git diff --check

      - name: 提交变更
        run: |
          if [ -z "$(git status --porcelain -- translations/frappe translations/erpnext translations/hrms translations/crm frappe_locale/locale)" ]; then
            echo "翻译包无变更"
            exit 0
          fi

          git config user.name "frappe-locale-bot"
          git config user.email "frappe-locale-bot@users.noreply.github.com"

          git add \
            translations/frappe/main.pot \
            "translations/frappe/$LOCALE.po" \
            translations/erpnext/main.pot \
            "translations/erpnext/$LOCALE.po" \
            translations/hrms/main.pot \
            "translations/hrms/$LOCALE.po" \
            translations/crm/main.pot \
            "translations/crm/$LOCALE.po" \
            "frappe_locale/locale/$LOCALE.po"
          git commit -m "chore: 更新语言包"
          git push origin "HEAD:$GITHUB_REF_NAME"
